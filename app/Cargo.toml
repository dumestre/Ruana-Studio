[package]
name = "ruana-studio"
version.workspace = true
edition.workspace = true

[dependencies]
daw-core = { path = "../crates/daw-core" }
daw-media = { path = "../crates/daw-media" }
daw-audio = { path = "../crates/daw-audio" }
daw-midi = { path = "../crates/daw-midi" }
slint = { workspace = true, features = ["renderer-skia", "raw-window-handle-06"] }
i-slint-backend-winit = "1.17.1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
raw-window-handle = "0.6"
png = "0.17"

[build-dependencies]
slint-build = "1.17.1"
resvg = { version = "0.48", features = ["raster-images"] }
usvg = "0.48"
tiny-skia = "0.8"
png = "0.17"
