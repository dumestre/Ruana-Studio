[package]
name = "ruana-studio"
default-run = "ruana-studio"
version.workspace = true
edition.workspace = true

[dependencies]
daw-core = { path = "../crates/daw-core" }
daw-media = { path = "../crates/daw-media" }
daw-audio = { path = "../crates/daw-audio" }
daw-midi = { path = "../crates/daw-midi" }
timeline-render = { path = "../timeline-render", default-features = false }
slint = { workspace = true, features = ["renderer-skia", "raw-window-handle-06", "unstable-wgpu-30"] }
winit = "0.30"
i-slint-backend-winit = "1.18.0"
raw-window-handle = "0.6"
png = "0.18.1"
wgpu = "30"
bytemuck = "1.14"
pollster = "0.4"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
] }
libloading = "0.9.0"

[target.'cfg(not(windows))'.dependencies]
rfd = "0.17"

[build-dependencies]
slint-build = "1.18.0"
resvg = { version = "0.48", features = ["raster-images"] }
usvg = "0.48"
tiny-skia = "0.12"
png = "0.18"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
