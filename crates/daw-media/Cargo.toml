[package]
name = "daw-media"
version.workspace = true
edition.workspace = true

[dependencies]
hound = "3.5"
dirs = "6.0"
tiny-skia = "0.12"
symphonia = { version = "0.6", features = ["wav", "mp3", "flac", "ogg", "pcm"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }