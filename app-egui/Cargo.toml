[package]
name = "ruana-studio-egui"
version.workspace = true
edition.workspace = true

# Port do shell Makepad → egui (fase 1): shell nativo (janela + transport) com
# a timeline real (timeline-render) em janela winit/wgpu dedicada.
# O app antigo (app/ com Slint) permanece no workspace até o port fechar.
[lib]
name = "ruana_studio_egui"
path = "src/lib.rs"

[[bin]]
name = "ruana-studio-egui"
path = "src/main.rs"

[dependencies]
egui = "0.36"
eframe = { version = "0.36", features = ["glow"] }
daw-core = { path = "../crates/daw-core" }
daw-audio = { path = "../crates/daw-audio" }