[package]
name = "ruana-studio-egui"
version.workspace = true
edition.workspace = true

[lib]
name = "ruana_studio_egui"
path = "src/lib.rs"

[[bin]]
name = "ruana-studio-egui"
path = "src/main.rs"

[dependencies]
egui = "0.36"
eframe = { version = "0.36", features = ["wgpu", "glow"] }
daw-core = { path = "../crates/daw-core" }
daw-audio = { path = "../crates/daw-audio" }
timeline-render = { path = "../timeline-render", default-features = false }
wgpu = "30"
pollster = "0.3"
bytemuck = "1.14"