[package]
name = "timeline-render"
version.workspace = true
edition.workspace = true

[[bin]] 
name = "timeline-render"
path = "src/main.rs"

[dependencies]
wgpu = "30.0.1"
winit = "0.30"
pollster = "1.0.1"
bytemuck = "1.14"
ab_glyph = "0.2"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell"] }
